<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>
气象局面试训练系统
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>
气象局面试训练系统
</h1>


<button onclick="randomQuestion()">
随机面试问题
</button>


<h2>
面试问题
</h2>


<div id="question">
点击按钮开始
</div>



<button onclick="showAnswer()">
查看参考答案
</button>


<h2>
参考答案
</h2>


<div id="answer">
请先选择问题
</div>


</div>



<script>


let questions=[];

let currentQuestion;



fetch("questions.json")

.then(response=>response.json())

.then(data=>{

questions=data;

});




function randomQuestion(){


let index=Math.floor(
Math.random()*questions.length
);


currentQuestion=questions[index];


document.getElementById("question").innerHTML=
currentQuestion["面试问题"];


document.getElementById("answer").innerHTML=
"请先思考，再查看答案";


}




function showAnswer(){


if(currentQuestion){


document.getElementById("answer").innerHTML=
currentQuestion["参考答案"] || "暂无参考答案";


}


}


</script>


</body>

</html>
