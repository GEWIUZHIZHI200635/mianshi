<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
气象局面试训练系统
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<select id="category">

<option value="全部">
全部问题
</option>

<option value="自我介绍">
自我介绍
</option>

<option value="岗位认知">
岗位认知
</option>

<option value="个人能力">
个人能力
</option>

<option value="专业能力">
专业能力
</option>

<option value="应急处理">
应急处理
</option>

<option value="区域气象认知">
区域气象认知
</option>

<option value="新疆气象认知">
新疆气象认知
</option>

<option value="气象基础知识">
气象基础知识
</option>


</select>
  

<button onclick="randomQuestion()">
随机面试问题
</button>



<div class="question-area">



<div id="question">
点击按钮开始
</div>


</div>



<!-- 空白距离 -->

<div class="answer-space">


<button onclick="showAnswer()">

参考答案

</button>




<div id="answer">

请先选择问题

</div>


</div>



</div>



<script>


let questions=[];

let currentQuestion;



fetch("questions.json")

.then(response=>response.json())

.then(data=>{

questions=data;

});




function randomQuestion(){


let category =
document.getElementById("category").value;



let list;



if(category=="全部"){


list=questions;


}

else{


list=questions.filter(function(item){

return item["分类"]==category;

});


}



let index=Math.floor(
Math.random()*list.length
);



currentQuestion=list[index];



document.getElementById("question").innerHTML=
currentQuestion["面试问题"];



}




function showAnswer(){


if(currentQuestion){


document.getElementById("answer").innerHTML=
currentQuestion["参考答案"] || "暂无参考答案";


}


}


</script>


</body>

</html>
